<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семинар</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            color: #333333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            width: 90%;
            text-align: center;
            padding: 40px 20px;
        }
        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #6b4e8a;
            margin-bottom: 60px;
            letter-spacing: 1px;
        }
        .greeting {
            font-size: 36px;
            font-weight: 700;
            color: #2c1a4a;
            margin-bottom: 30px;
            line-height: 1.2;
        }
        .instruction {
            font-size: 20px;
            font-weight: 500;
            color: #666666;
            margin-bottom: 50px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            padding: 18px 45px;
            background: linear-gradient(90deg, #6b4e8a, #8a6cb2);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(107, 78, 138, 0.3);
            position: relative;
            overflow: hidden;
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.2),
                transparent
            );
            transition: left 0.5s;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(107, 78, 138, 0.4);
        }
        .btn:hover::before {
            left: 100%;
        }
        footer {
            margin-top: 80px;
            text-align: center;
            color: #999999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"></div>
        <h1 class="greeting">рады видеть на семинаре :)</h1>
        <p class="instruction">Чтобы продолжить, нажми кнопку</p>
        <a href="task.html" class="btn">Перейти к заданию</a>
        <footer>© 2026 
        </footer>
    </div>
</body>
</html>
