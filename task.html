<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>задание семинара</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            color: #333333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            width: 90%;
            text-align: center;
            padding: 40px 20px;
        }
        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #6b4e8a;
            margin-bottom: 60px;
            letter-spacing: 1px;
        }
        .task-content {
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            max-width: 600px;
            margin: 0 auto;
        }
        .task-title {
            font-size: 28px;
            font-weight: 700;
            color: #2c1a4a;
            margin-bottom: 30px;
        }
        .task-text {
            font-size: 22px;
            font-weight: 500;
            color: #444444;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        .back-link {
            display: inline-block;
            padding: 14px 35px;
            background-color: #f5f0ff;
            color: #6b4e8a;
            text-decoration: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid #6b4e8a;
        }
        .back-link:hover {
            background-color: #6b4e8a;
            color: white;
            transform: translateY(-2px);
        }
        footer {
            margin-top: 80px;
            text-align: center;
            color: #999999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"></div>
        <div class="task-content">
            <h2 class="task-title">Задание</h2>
            <p class="task-text">Предложи каждому, кого видишь рядом, сыграть в «камень-ножницы-бумага»</p>
            <a href="index.html" class="back-link">Вернуться на главную</a>
        </div>
        <footer></footer>
    </div>
</body>
</html>
